<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultron-J</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--blue-glow:rgba(59,130,246,0.35);--blue-dim:rgba(59,130,246,0.12);--gray:#9ca3af;--white:#ffffff;--border:rgba(255,255,255,0.08)}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#bg{position:fixed;inset:0;background-size:cover;background-position:center top;opacity:1;z-index:0;pointer-events:none}
#bg-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.0) 0%,rgba(0,0,0,0.4) 100%);z-index:1;pointer-events:none}
#navbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:54px;background:rgba(0,0,0,0.82);border-bottom:1px solid var(--border);backdrop-filter:blur(24px);flex-shrink:0}
#logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:0.06em;color:#fff}
#model-switcher{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:100px;padding:3px}
.model-btn{padding:5px 16px;border-radius:100px;border:none;background:transparent;color:var(--gray);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;white-space:nowrap;font-family:inherit}
.model-btn:hover{color:#fff}
.model-btn.active{background:var(--blue);color:#fff;box-shadow:0 0 14px var(--blue-glow)}
#provider-indicator{display:flex;align-items:center;gap:7px;font-size:12px;color:#ffffff;min-width:90px;justify-content:flex-end}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 6px var(--blue);flex-shrink:0}
#chat-area{position:relative;z-index:5;flex:1;overflow-y:auto;padding:20px 0 155px;scroll-behavior:smooth}
#chat-area::-webkit-scrollbar{width:3px}
#chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;pointer-events:none}
.empty-title{font-size:26px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.05em}
.empty-sub{font-size:14px;color:rgba(255,255,255,0.2)}
.msg-row{padding:6px 0;animation:fadeUp 0.22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-inner{max-width:740px;margin:0 auto;padding:0 24px}
.user-row .msg-inner{display:flex;justify-content:flex-end}
.user-bubble{background:var(--blue-dim);border:1px solid rgba(59,130,246,0.22);border-radius:18px 18px 4px 18px;padding:11px 16px;font-size:15px;line-height:1.6;max-width:82%;color:#fff;word-break:break-word}
.ultron-row .msg-inner{display:flex;align-items:flex-start}
.ultron-content{flex:1;min-width:0}
.ultron-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ultron-name{font-size:11px;font-weight:700;color:#ffffff;letter-spacing:0.1em;text-transform:uppercase;flex-shrink:0}
.chakra-wrap{width:22px;height:22px;flex-shrink:0;opacity:0;transition:opacity 0.3s}
.chakra-wrap.thinking{opacity:1}
.chakra-svg{width:100%;height:100%}
.r1{animation:cw 1.1s linear infinite;transform-origin:50px 50px}
.r2{animation:ccw 1.8s linear infinite;transform-origin:50px 50px}
.r3{animation:cw 2.4s linear infinite;transform-origin:50px 50px}
.spk{animation:cw 0.75s linear infinite;transform-origin:50px 50px}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
.think-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,0.45);font-style:italic;letter-spacing:0.02em;margin-left:4px;transition:opacity 0.35s,transform 0.35s;white-space:nowrap}
.think-tag.gone{opacity:0;transform:translateY(-3px);pointer-events:none}
.spark-svg{width:14px;height:14px;flex-shrink:0;animation:spark-pulse 1.4s ease-in-out infinite}
@keyframes spark-pulse{0%,100%{transform:rotate(0deg) scale(1);opacity:.65}50%{transform:rotate(22.5deg) scale(1.35);opacity:1}}
@keyframes thinking-dots{0%,15%{content:''}30%{content:'.'}50%{content:'..'}70%,100%{content:'...'}}
.think-dots::after{content:'...';animation:dot-cycle 1.6s steps(1) infinite}
@keyframes dot-cycle{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.ultron-text{font-size:15px;line-height:1.75;color:#ffffff !important;word-break:break-word}
.ultron-text strong{color:#fff;font-weight:600}
.ultron-text pre{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:14px;overflow-x:auto;margin:10px 0;font-family:monospace;font-size:13px;line-height:1.5}
.ultron-text code{background:var(--blue-dim);padding:2px 7px;border-radius:5px;font-family:monospace;font-size:13px;color:#93c5fd}
.ultron-text pre code{background:transparent;padding:0;color:rgba(255,255,255,0.82)}
#input-area{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 24px 28px;background:linear-gradient(to top,rgba(0,0,0,0.98) 65%,transparent)}
#pill{max-width:740px;margin:0 auto;background:rgba(18,18,18,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:26px;display:flex;align-items:flex-end;gap:6px;padding:10px 10px 10px 16px;backdrop-filter:blur(24px);transition:border-color 0.2s,box-shadow 0.2s}
#pill:focus-within{border-color:rgba(59,130,246,0.45);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
#txt{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;line-height:1.55;resize:none;max-height:160px;overflow-y:auto;font-family:inherit;padding:3px 0}
#txt::placeholder{color:rgba(255,255,255,0.25)}
#txt::-webkit-scrollbar{display:none}
.ibtn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.07);color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;padding:0}
.ibtn:hover{background:rgba(255,255,255,0.14);color:#fff}
.ibtn.on{background:var(--blue);color:#fff;box-shadow:0 0 12px var(--blue-glow)}
#stop-btn{background:rgba(239,68,68,0.18);color:#ef4444;display:none}
#stop-btn.show{display:flex}
#stop-btn:hover{background:rgba(239,68,68,0.3)}
#send-btn{background:var(--blue);color:#fff;box-shadow:0 0 14px var(--blue-glow)}
#send-btn:hover{background:#2563eb}
#send-btn:disabled{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.25);box-shadow:none;cursor:not-allowed}
#mic-btn.listening{background:var(--blue);color:#fff}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bg-overlay"></div>
<nav id="navbar">
  <div id="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="11" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="6.5" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>
      <circle cx="12" cy="12" r="2.5" fill="#3b82f6"/>
    </svg>
    ULTRON&#8209;J
  </div>
  <div id="model-switcher">
    <button class="model-btn active" onclick="switchModel('groq',this)">Groq</button>
    <button class="model-btn" onclick="switchModel('gemini',this)">Gemini</button>
    <button class="model-btn" onclick="switchModel('openrouter',this)">OpenRouter</button>
  </div>
  <div id="provider-indicator">
    <div class="pdot"></div>
    <span id="prov-text">groq</span>
  </div>
</nav>
<div id="chat-area">
  <div id="empty-state">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" opacity="0.15">
      <circle cx="26" cy="26" r="24" stroke="white" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="14" stroke="white" stroke-width="1" stroke-dasharray="4 3"/>
      <circle cx="26" cy="26" r="6" stroke="white" stroke-width="1"/>
      <circle cx="26" cy="26" r="2.5" fill="white"/>
    </svg>
    <div class="empty-title">ULTRON&#8209;J</div>
    <div class="empty-sub">Your autonomous AI &#8212; ask anything</div>
  </div>
  <div id="msgs"></div>
</div>
<div id="input-area">
  <div id="pill">
    <textarea id="txt" placeholder="Message Ultron..." rows="1"></textarea>
    <button class="ibtn" id="stop-btn" title="Stop" onclick="stopStream()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><rect width="13" height="13" rx="2"/></svg>
    </button>
    <button class="ibtn" id="speaker-btn" title="Voice output" onclick="toggleSpeaker()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
    <button class="ibtn" id="mic-btn" title="Voice input" onclick="toggleMic()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="ibtn" id="send-btn" title="Send" onclick="doSend(null)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
</div>
<script>
var model = 'groq';
var sid = 's_' + Date.now();
var streaming = false;
var reader = null;
var micOn = false;
var speakerOn = false;
var audioQueue = [];
var audioPlaying = false;

function playAudioChunk(b64) {
    if (!speakerOn || !b64) return;
    audioQueue.push(b64);
    if (!audioPlaying) drainAudioQueue();
}
function drainAudioQueue() {
    if (!audioQueue.length) { audioPlaying = false; return; }
    audioPlaying = true;
    var b64 = audioQueue.shift();
    try {
        var bytes = atob(b64);
        var arr = new Uint8Array(bytes.length);
        for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        var blob = new Blob([arr], { type: 'audio/mpeg' });
        var url = URL.createObjectURL(blob);
        var a = new Audio(url);
        a.onended = function() { URL.revokeObjectURL(url); drainAudioQueue(); };
        a.onerror = function() { URL.revokeObjectURL(url); drainAudioQueue(); };
        a.play().catch(function() { drainAudioQueue(); });
    } catch(e) { drainAudioQueue(); }
}

// Build Sudarshana Chakra SVG without any regex

  var i, a, x1, y1, x2, y2, out = '';

  for (i = 0; i < 16; i++) {
    a = (i / 16) * 3.14159265 * 2;
    x1 = (50 + Math.cos(a) * 36).toFixed(1);
    y1 = (50 + Math.sin(a) * 36).toFixed(1);
    x2 = (50 + Math.cos(a) * 46).toFixed(1);
    y2 = (50 + Math.sin(a) * 46).toFixed(1);
    out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>';
  }
  out += '<circle cx="50" cy="50" r="35" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.55"/></g>';

  // Mid ring spokes
  out += '<g class="r2">';
  for (i = 0; i < 12; i++) {
    a = (i / 12) * 3.14159265 * 2;
    x1 = (50 + Math.cos(a) * 22).toFixed(1);
    y1 = (50 + Math.sin(a) * 22).toFixed(1);
    x2 = (50 + Math.cos(a) * 32).toFixed(1);
    y2 = (50 + Math.sin(a) * 32).toFixed(1);
    out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>';
  }
  out += '<circle cx="50" cy="50" r="26" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.45"/></g>';

  // Inner spokes
  out += '<g class="spk">';
  for (i = 0; i < 8; i++) {
    a = (i / 8) * 3.14159265 * 2;
    x2 = (50 + Math.cos(a) * 18).toFixed(1);
    y2 = (50 + Math.sin(a) * 18).toFixed(1);
    out += '<line x1="50" y1="50" x2="' + x2 + '" y2="' + y2 + '" stroke="#93c5fd" stroke-width="1"/>';
  }
  out += '<circle cx="50" cy="50" r="18" fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/></g>';

  out += '<g class="r3"><circle cx="50" cy="50" r="10" fill="none" stroke="#bfdbfe" stroke-width="1.5" opacity="0.5"/></g>';
  out += '<circle cx="50" cy="50" r="4.5" fill="#3b82f6" opacity="0.9"/>';
  out += '<circle cx="50" cy="50" r="2" fill="#fff"/>';
  out += '</svg>';
  return out;
}

function sparkSVG() {
  // 4-pointed orange star — like Claude's thinking sparkle
  return '<svg class="spark-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" fill="#f97316" opacity="0.95"/>'
    + '<circle cx="12" cy="12" r="2" fill="#fff" opacity="0.6"/>'
    + '</svg>';
}

function switchModel(m, btn) {
  model = m;
  var btns = document.querySelectorAll('.model-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
  btn.classList.add('active');
}

var txt = document.getElementById('txt');
txt.addEventListener('input', function() {
  txt.style.height = 'auto';
  txt.style.height = Math.min(txt.scrollHeight, 160) + 'px';
});
txt.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(null); }
});

// Safe text escaping without regex
function escHtml(t) {
  return t.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
}

// Simple text formatter without regex
function fmt(t) {
  return escHtml(t).split('\n').join('<br>');
}

function scrollBot() { var a = document.getElementById('chat-area'); a.scrollTop = a.scrollHeight; }
function hideEmpty() { document.getElementById('empty-state').style.display = 'none'; }

function addUser(q) {
  hideEmpty();
  var d = document.createElement('div');
  d.className = 'msg-row user-row';
  var inner = document.createElement('div');
  inner.className = 'msg-inner';
  var bub = document.createElement('div');
  bub.className = 'user-bubble';
  bub.style.color = '#ffffff';
  bub.textContent = q;
  inner.appendChild(bub);
  d.appendChild(inner);
  document.getElementById('msgs').appendChild(d);
  scrollBot();
}

function addUltron() {
  hideEmpty();
  var id = 'm' + Date.now();
  var d = document.createElement('div');
  d.className = 'msg-row ultron-row';
  var inner = document.createElement('div');
  inner.className = 'msg-inner';
  var content = document.createElement('div');
  content.className = 'ultron-content';
  var nameRow = document.createElement('div');
  nameRow.className = 'ultron-name-row';
  var name = document.createElement('div');
  name.className = 'ultron-name';
  name.innerHTML = 'Ultron&#8209;J';
  var chakra = document.createElement('div');
  chakra.className = 'chakra-wrap thinking';
  chakra.id = 'ck_' + id;
  chakra.innerHTML = chakraSVG();
  var thinkTag = document.createElement('span');
  thinkTag.className = 'think-tag';
  thinkTag.id = 'tk_' + id;
  thinkTag.innerHTML = sparkSVG() + '<span class="think-dots">Thinking</span>';
  nameRow.appendChild(name);
  nameRow.appendChild(chakra);
  nameRow.appendChild(thinkTag);
  var textEl = document.createElement('div');
  textEl.className = 'ultron-text';
  textEl.id = id;
  textEl.style.color = '#ffffff';
  content.appendChild(nameRow);
  content.appendChild(textEl);
  inner.appendChild(content);
  d.appendChild(inner);
  document.getElementById('msgs').appendChild(d);
  scrollBot();
  return id;
}

function stopChakra(id) {
  var c = document.getElementById('ck_' + id);
  if (c) {
    c.classList.remove('thinking');
    setTimeout(function() { if (c.parentNode) c.remove(); }, 400);
  }
}

function stopStream() {
  if (reader) { try { reader.cancel(); } catch(e) {} }
  reader = null; streaming = false;
  document.getElementById('stop-btn').classList.remove('show');
  document.getElementById('send-btn').disabled = false;
}

function isStatus(t) {
  return (t.indexOf('[THINKING]') === 0 || t.indexOf('Searching') === 0 || t.indexOf('Analyzing') === 0);
}

async function doSend(forced) {
  var q = forced || txt.value;
  q = q.trim();
  if (!q || streaming) return;
  txt.value = ''; txt.style.height = 'auto';
  streaming = true;
  document.getElementById('stop-btn').classList.add('show');
  document.getElementById('send-btn').disabled = true;
  addUser(q);
  var mid = addUltron();
  var el = document.getElementById(mid);
  var full = '';
  try {
    var res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: sid, provider: model, temperature: 0.7, voice: speakerOn })
    });
    var r = res.body.getReader();
    reader = r;
    var dec = new TextDecoder();
    var buf = '';
    var _thinkGone = false;
    while (true) {
      var rd = await r.read();
      if (rd.done) break;
      buf += dec.decode(rd.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop();
      for (var li = 0; li < lines.length; li++) {
        var ln = lines[li];
        if (ln.indexOf('data: ') !== 0) continue;
        var raw = ln.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        try {
          var o = JSON.parse(raw);
          if (o.token && !isStatus(o.token)) {
            if (!_thinkGone) {
              var _tk = document.getElementById('tk_' + mid);
              if (_tk) _tk.classList.add('gone');
              _thinkGone = true;
            }
            full += o.token;
            el.textContent = full;
            el.style.color = '#ffffff';
            scrollBot();
          }
          if (o._full) {
            if (!_thinkGone) {
              var _tk2 = document.getElementById('tk_' + mid);
              if (_tk2) _tk2.classList.add('gone');
              _thinkGone = true;
            }
            full = o._full;
            el.textContent = full;
            el.style.color = '#ffffff';
            if (o.provider) document.getElementById('prov-text').textContent = o.provider.split(':')[0];
          }
          if (o.type === 'sentence' && o.audio_b64) { playAudioChunk(o.audio_b64); }
          if (o.done) { stopChakra(mid); stopStream(); }
        } catch(e) {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') el.textContent = 'Connection error - is Ultron running?';
  }
  stopChakra(mid); stopStream(); scrollBot();
}

function toggleMic() {
  if (!micOn) { startMic(); return; }
  // Click while recording = stop this segment immediately and send it
  if (_mediaRecorder && _mediaRecorder.state === 'recording') {
    clearTimeout(_vadTimer); _vadTimer = null;
    clearTimeout(_maxTimer); _maxTimer = null;
    _speaking = true; // force send even if VAD didn't trigger
    _mediaRecorder.stop();
  } else { stopMic(); }
}
function startMic() {
  micOn = true;
  document.getElementById('mic-btn').classList.add('listening');
  txt.placeholder = 'Calibrating mic...';
  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(function(stream) {
      _mediaStream = stream;
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      _analyser = _audioCtx.createAnalyser();
      _analyser.fftSize = 512;
      _audioCtx.createMediaStreamSource(stream).connect(_analyser);
      _calibrate();
    })
    .catch(function(err) {
      stopMic();
      txt.placeholder = 'Mic denied: ' + err.message;
    });
}
function _calibrate() {
  var buf = new Uint8Array(_analyser.frequencyBinCount);
  var samples = [], end = Date.now() + 300;  // was 600ms
  function step() {
    _analyser.getByteFrequencyData(buf);
    var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i];
    samples.push(s / buf.length);
    if (Date.now() < end) { requestAnimationFrame(step); return; }
    var ambient = samples.reduce(function(a,b){return a+b;},0) / samples.length;
    VAD_THRESH = Math.max(ambient * 2.5, 18);
    txt.placeholder = 'Listening... speak now';
    _beginSegment();
  }
  requestAnimationFrame(step);
}
function _beginSegment() {
  if (!micOn) return;
  _audioChunks = [];
  _speaking = false;
  _segActive = true;
  clearTimeout(_vadTimer); _vadTimer = null;
  clearTimeout(_maxTimer); _maxTimer = null;
  var opts = {};
  var _mime = '';
  if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) { _mime = 'audio/webm;codecs=opus'; }
  else if (MediaRecorder.isTypeSupported('audio/webm'))        { _mime = 'audio/webm'; }
  else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) { _mime = 'audio/ogg;codecs=opus'; }
  else if (MediaRecorder.isTypeSupported('audio/ogg'))         { _mime = 'audio/ogg'; }
  if (_mime) opts.mimeType = _mime;
  console.log('[mic] MediaRecorder mimeType:', _mime || '(browser default)');
  _mediaRecorder = new MediaRecorder(_mediaStream, opts);
  _mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) _audioChunks.push(e.data);
  };
  _mediaRecorder.onstop = function() {
    _segActive = false;
    clearTimeout(_vadTimer); _vadTimer = null;
    clearTimeout(_maxTimer); _maxTimer = null;
    var chunks = _audioChunks.slice(); _audioChunks = [];
    if (chunks.length && _speaking) {
      var blobType = _mediaRecorder.mimeType || 'audio/webm';
      var ext = blobType.indexOf('ogg') !== -1 ? 'ogg' : 'webm';
      console.log('[mic] sending blob:', chunks.length, 'chunks, type:', blobType, 'ext:', ext);
      _sendForTranscription(new Blob(chunks, { type: blobType }), ext);
    } else if (micOn) setTimeout(_beginSegment, 100);
  };
  _mediaRecorder.start(100);  // was 250ms — finer audio chunks for faster VAD
  // Hard max — cut after MAX_SEG_MS regardless of speech
  _maxTimer = setTimeout(function() {
    if (_mediaRecorder && _mediaRecorder.state === 'recording') {
      _speaking = true; _mediaRecorder.stop();
    }
  }, MAX_SEG_MS);
  _runVAD(++_vadGen);
}
function _runVAD(gen) {
  if (!_analyser) return;
  var buf = new Uint8Array(_analyser.frequencyBinCount);
  function tick() {
    if (!micOn || gen !== _vadGen) return;
    _analyser.getByteFrequencyData(buf);
    var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i];
    var avg = s / buf.length;
    if (avg > VAD_THRESH) {
      _speaking = true;
      if (_vadTimer) { clearTimeout(_vadTimer); _vadTimer = null; }
      txt.placeholder = 'Speaking...';
    } else if (_speaking && !_vadTimer) {
      _vadTimer = setTimeout(function() {
        _vadTimer = null;
        if (_mediaRecorder && _mediaRecorder.state === 'recording') _mediaRecorder.stop();
      }, SILENCE_MS);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function _sendForTranscription(blob, ext) {
  ext = ext || 'webm';
  console.log('[mic] blob size:', blob.size, 'bytes');
  if (blob.size < 1000) {
    console.log('[mic] blob too small, skipping');
    if (micOn) { txt.placeholder = 'Listening... speak now'; setTimeout(_beginSegment, 100); }
    return;
  }
  var fd = new FormData();
  fd.append('audio', blob, 'voice.' + ext);
  txt.placeholder = 'Transcribing...';
  fetch('/api/voice/transcribe', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      console.log('[mic] transcribe response:', d);
      var t = (d.text || '').trim();
      if (t) { txt.value = t; if (!streaming) { doSend(t); txt.value = ''; } }
      if (micOn) { txt.placeholder = 'Listening... speak now'; setTimeout(_beginSegment, 100); }
    })
    .catch(function(err) {
      console.error('[mic] transcribe error:', err);
      if (micOn) { txt.placeholder = 'Listening... speak now'; setTimeout(_beginSegment, 100); }
    });
}
function stopMic() {
  micOn = false;
  _segActive = false;
  _speaking = false;
  _vadGen++;
  clearTimeout(_vadTimer);
  _vadTimer = null;
  document.getElementById('mic-btn').classList.remove('listening');
  txt.placeholder = 'Message Ultron...';
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    try { _mediaRecorder.stop(); } catch(e) {}
  }
  _mediaRecorder = null;
  _audioChunks = [];
  if (_mediaStream) { _mediaStream.getTracks().forEach(function(t) { t.stop(); }); _mediaStream = null; }
  if (_audioCtx) { try { _audioCtx.close(); } catch(e) {} _audioCtx = null; _analyser = null; }
}
function toggleSpeaker() {
  speakerOn = !speakerOn;
  document.getElementById('speaker-btn').classList.toggle('on', speakerOn);
}
</script>
