<title>ONE MORE</title>
<style>
/* ONE MORE — design system.
   Black ground, white geometry, grey for anything that is not the game. One
   typeface family, two weights, and numbers in monospace so a timer never
   reflows mid-run. No colour anywhere: the whole identity is contrast. */
:root {
  --bg: #08090c;
  --ink: #e8eaf0;
  --dim: rgba(232, 234, 240, 0.56);
  --faint: rgba(232, 234, 240, 0.30);
  --line: rgba(232, 234, 240, 0.14);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  background: rgba(8, 9, 12, 0.86);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade .16s ease-out;
}
.screen.on { display: flex; }
/* The menu sits over a live attract loop, so it stays lighter and unblurred —
   the point is that you can see the game teaching itself behind the buttons. */
#s-menu { background: linear-gradient(180deg, rgba(8,9,12,.94) 0%, rgba(8,9,12,.72) 40%, rgba(8,9,12,.94) 100%); backdrop-filter: none; -webkit-backdrop-filter: none; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { width: min(460px, 100%); text-align: center; }
/* The results screen carries a replay and an analysis now, so it scrolls on a
   phone. Tap-to-restart is a real tap detector in boot.js precisely because of
   this — firing on pointerdown would restart the run on every scroll. */
.wrap.result { max-height: 100%; overflow-y: auto; touch-action: pan-y; padding: 2px; }
.wrap.scrolly { max-height: 100%; overflow-y: auto; touch-action: pan-y; padding: 4px; }

/* ---------- type ---------- */
.logo {
  font-size: clamp(38px, 11vw, 60px); font-weight: 700;
  letter-spacing: .16em; margin: 0 0 6px; line-height: 1;
}
.logo .o { position: relative; display: inline-block; animation: orbit 3.4s ease-in-out infinite; }
@keyframes orbit { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.12em); } }
.tag { color: var(--dim); font-size: 13px; margin: 0 0 34px; letter-spacing: .05em; }
.kicker { font-size: 11px; letter-spacing: .28em; color: var(--faint); margin: 0 0 10px; }
.muted { color: var(--dim); }
.small { font-size: 12px; }
.hint { color: var(--faint); font-size: 11px; letter-spacing: .12em; margin-top: 14px; }
.foot { margin-top: 30px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.foot .dot { margin: 0 10px; }

/* ---------- buttons ---------- */
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.btn {
  font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: .16em;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 2px;
  padding: 15px 22px; cursor: pointer; width: 100%;
  transition: transform .09s ease, background .14s ease, border-color .14s ease;
}
.btn:hover { background: rgba(232, 234, 240, .06); border-color: rgba(232, 234, 240, .3); }
.btn:active { transform: scale(.978); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: #fff; }
.btn.huge { font-size: 19px; padding: 22px; margin: 4px 0 18px; letter-spacing: .2em; }
.btn.small { width: auto; flex: 1 1 auto; padding: 12px 16px; font-size: 12px; }
.btn em { font-style: normal; display: block; font-size: 10px; color: var(--faint); letter-spacing: .1em; margin-top: 4px; }
.btn.primary em { color: rgba(8, 9, 12, .6); }

/* ---------- results ---------- */
.bigtime {
  font-family: var(--mono); font-size: clamp(46px, 15vw, 74px); font-weight: 600;
  letter-spacing: -.02em; line-height: 1; margin: 4px 0 8px;
  font-variant-numeric: tabular-nums;
}
.delta { font-family: var(--mono); font-size: 13px; color: var(--dim); margin: 0 0 14px; min-height: 18px; }
.delta.record { color: var(--ink); letter-spacing: .18em; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 18px; }
.stats div { background: var(--bg); padding: 12px 4px; }
.stats .n { font-family: var(--mono); font-size: 17px; display: block; }
.stats .k { font-size: 9px; letter-spacing: .14em; color: var(--faint); display: block; margin-top: 4px; }
/* Death replay: a wide, cinematic strip. Fixed aspect so the layout never
   jumps when it loads, and it sits directly under the time because "what
   killed me" is the first question anyone has. */
.replay { position: relative; width: 100%; aspect-ratio: 20 / 9; border: 1px solid var(--line); margin-bottom: 16px; background: var(--bg); overflow: hidden; }
.replay canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.replay.off { display: none; }

/* The read: the game's one honest observation about how you play. */
.read { border-left: 2px solid var(--ink); padding: 10px 0 10px 14px; margin: 0 0 16px; text-align: left; }
.read b { display: block; font-size: 11px; letter-spacing: .22em; margin-bottom: 5px; }
.read span { display: block; font-size: 12px; color: var(--dim); line-height: 1.5; }
.read i { display: block; font-style: normal; font-size: 11px; color: var(--faint); margin-top: 5px; }
.read.quiet { border-left-color: var(--line); }
/* A verdict is a measurement, not advice, so it is set brighter than the fix
   lines around it and boxed off. Weight and a rule, not colour. */
.read i.verdict { color: var(--dim); border-top: 1px solid var(--line); padding-top: 7px; margin-top: 9px; }
.read i.verdict + i.verdict { border-top: 0; padding-top: 0; margin-top: 4px; }

.xpbar { position: relative; height: 22px; border: 1px solid var(--line); margin-bottom: 6px; overflow: hidden; }
/* Fills by transform, not width: a scale is composited, a width is a layout
   pass on every frame of the half second it takes to fill.
   overflow:hidden is belt-and-braces — levelInfo() clamps frac at the cap, but
   a scaleX above 1 would spill past the border and it costs nothing to stop. */
.xpbar i { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: rgba(232, 234, 240, .16); transition: transform .5s ease; }
.xpbar span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; }
.unlocks { min-height: 0; }
.unlocks p { font-size: 11px; letter-spacing: .16em; margin: 8px 0 0; animation: fade .3s ease-out; }
.result .row { margin-top: 16px; }

/* ---------- cards / lists ---------- */
.card { border: 1px solid var(--line); padding: 26px 20px; margin-bottom: 16px; }
.day { font-family: var(--mono); font-size: 34px; font-weight: 600; margin: 4px 0; }
.split { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 20px 0 14px; }
.split div { flex: 1; background: var(--bg); padding: 12px 6px; }
.lbl { display: block; font-size: 9px; letter-spacing: .16em; color: var(--faint); }
.val { display: block; font-family: var(--mono); font-size: 19px; margin-top: 5px; }

.list { border-top: 1px solid var(--line); margin: 14px 0; }
.list .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 12px; text-align: left; }
.list .item b { font-weight: 600; letter-spacing: .1em; }
.list .item span { font-family: var(--mono); color: var(--dim); }
.list .item.locked { opacity: .38; }
.list .item i { font-style: normal; color: var(--faint); font-size: 10px; letter-spacing: .12em; display: block; margin-top: 3px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 22px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  font-family: var(--sans); font-size: 11px; letter-spacing: .14em; font-weight: 600;
  padding: 10px 13px; cursor: pointer; border-radius: 2px;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .3; cursor: default; }
.chip small { display: block; font-size: 9px; letter-spacing: .1em; opacity: .7; margin-top: 3px; font-weight: 400; }
h3 { font-size: 11px; letter-spacing: .24em; color: var(--faint); font-weight: 600; margin: 22px 0 0; text-align: left; }

.toggle { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 13px; letter-spacing: .06em; }
.toggle button { width: 52px; height: 26px; border: 1px solid var(--line); background: transparent; border-radius: 2px; cursor: pointer; position: relative; }
.toggle button::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--faint); transition: transform .16s ease, background .16s ease; }
.toggle button[aria-pressed="true"]::after { transform: translateX(24px); background: var(--ink); }

/* ---------- chrome ---------- */
#pause-btn {
  position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px;
  width: 38px; height: 38px; display: none; place-items: center;
  background: transparent; border: 1px solid var(--line); color: var(--dim);
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; cursor: pointer; border-radius: 2px;
}
#pause-btn.on { display: grid; }
#toast {
  position: absolute; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  font-size: 11px; letter-spacing: .16em; color: var(--dim);
  border: 1px solid var(--line); background: rgba(8, 9, 12, .92);
  padding: 10px 16px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .screen, .unlocks p { animation: none; }
  .logo .o { animation: none; }
}

</style>
<div id="app">
  <canvas id="stage" aria-label="ONE MORE game" role="img"></canvas>

  <!-- ===== MENU ===== -->
  <section class="screen" id="s-menu" data-screen="menu">
    <div class="wrap">
      <h1 class="logo">ONE M<span class="o">O</span>RE</h1>
      <p class="tag">Tap to flip gravity. Survive one more time.</p>
      <div class="stack">
        <button class="btn primary" data-act="play">PLAY</button>
        <button class="btn" data-act="daily">DAILY CHALLENGE<em id="daily-badge"></em></button>
        <button class="btn" id="menu-challenge" data-act="challenge" hidden>CHALLENGE RUN<em></em></button>
        <button class="btn" id="menu-trial" data-act="trial" hidden>TRIAL<em></em></button>
        <button class="btn" id="menu-nightmare" data-act="nightmare" hidden>NIGHTMARE<em></em></button>
        <div class="row">
          <button class="btn small" data-act="records">PROFILE</button>
          <button class="btn small" data-act="garage">GARAGE</button>
          <button class="btn small" data-act="settings">SETTINGS</button>
        </div>
      </div>
      <p class="foot"><span id="menu-best">—</span><span class="dot">·</span><span id="menu-level">LEVEL 1</span></p>
    </div>
  </section>

  <!-- ===== RESULTS ===== -->
  <section class="screen" id="s-result" data-screen="result">
    <div class="wrap result">
      <p class="kicker" id="r-kicker">YOU SURVIVED</p>
      <div class="bigtime" id="r-time">00:00.00</div>
      <p class="delta" id="r-delta"></p>
      <!-- The restart button sits directly under the time so it is above the
           fold on every screen. Everything below it is optional detail; the one
           thing that must never require a scroll is going again. -->
      <button class="btn primary huge" data-act="again">ONE MORE</button>
      <div class="replay"><canvas id="r-replay"></canvas></div>
      <div class="stats" id="r-stats"></div>
      <div class="read" id="r-read"></div>
      <div class="xpbar"><i id="r-xpfill"></i><span id="r-xplabel"></span></div>
      <div id="r-unlocks" class="unlocks"></div>
      <div class="row" id="r-actions">
        <button class="btn small" data-act="retry" hidden>RETRY RUN</button>
        <button class="btn small" data-act="trial" hidden>TRIAL</button>

        <button class="btn small" data-act="menu">MENU</button>
      </div>
      <p class="hint">tap anywhere to go again</p>
    </div>
  </section>

  <!-- ===== DAILY ===== -->
  <section class="screen" id="s-daily" data-screen="daily">
    <div class="wrap">
      <div class="card">
        <p class="kicker">DAILY CHALLENGE</p>
        <div class="day" id="d-day">DAY 1</div>
        <p class="muted" id="d-date"></p>
        <div class="split">
          <div><span class="lbl">YOUR BEST</span><span class="val" id="d-best">—</span></div>
          <div><span class="lbl">STREAK</span><span class="val" id="d-streak">0</span></div>
        </div>
        <p class="muted small" id="d-note">Everyone in the world gets this exact layout today.</p>
        <p class="muted small" id="d-reset"></p>
      </div>
      <button class="btn primary" data-act="play-daily">PLAY TODAY</button>
      <button class="btn small" data-act="menu">BACK</button>
    </div>
  </section>

  <!-- ===== RECORDS ===== -->
  <section class="screen" id="s-records" data-screen="records">
    <div class="wrap scrolly">
      <p class="kicker">RECORDS</p>
      <div id="rec-body"></div>
      <button class="btn small" data-act="menu">BACK</button>
    </div>
  </section>

  <!-- ===== GARAGE ===== -->
  <section class="screen" id="s-garage" data-screen="garage">
    <div class="wrap scrolly">
      <p class="kicker">GARAGE</p>
      <p class="muted small">Cosmetic only. Every player has the same game.</p>
      <div id="gar-body"></div>
      <button class="btn small" data-act="menu">BACK</button>
    </div>
  </section>

  <!-- ===== SETTINGS ===== -->
  <section class="screen" id="s-settings" data-screen="settings">
    <div class="wrap scrolly">
      <p class="kicker">SETTINGS</p>
      <div id="set-body"></div>
      <button class="btn small" data-act="menu">BACK</button>
    </div>
  </section>

  <!-- ===== PAUSE ===== -->
  <section class="screen" id="s-pause" data-screen="pause">
    <div class="wrap">
      <p class="kicker">PAUSED</p>
      <button class="btn primary" data-act="resume">RESUME</button>
      <button class="btn small" data-act="quit">END RUN</button>
    </div>
  </section>

  <button id="pause-btn" aria-label="Pause">II</button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* ==== src/00-core.js ==== */
/* ONE MORE — core utilities, deterministic RNG, storage, formatting.
   Every file attaches to the global OM namespace and is wrapped in an IIFE so
   the dev <script> tags and the single-file bundle behave identically. */
(function (root) {
  'use strict';
  var OM = root.OM || (root.OM = {});

  /* ---------- math ---------- */
  var M = OM.math = {
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    // frame-rate independent exponential approach
    approach: function (a, b, rate, dt) { return b + (a - b) * Math.exp(-rate * dt); },
    smooth: function (t) { return t * t * (3 - 2 * t); },
    sign: function (v) { return v < 0 ? -1 : 1; },
    rand: function (a, b) { return a + Math.random() * (b - a); }
  };

  /* ---------- deterministic RNG (mulberry32) ----------
     Used for the Daily Challenge so every player on a given day gets a
     byte-identical world. */
  OM.rng = function (seed) {
    var a = (seed >>> 0) || 1;
    function next() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next: next,
      range: function (lo, hi) { return lo + next() * (hi - lo); },
      int: function (lo, hi) { return Math.floor(lo + next() * (hi - lo + 1)); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      chance: function (p) { return next() < p; }
    };
  };

  /* String -> 32bit seed, so "2026-08-30" maps to a stable world. */
  OM.hashSeed = function (str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };

  /* ---------- time ---------- */
  // 107.283 -> "01:47.28"
  OM.fmtTime = function (sec, decimals) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var d = decimals == null ? 2 : decimals;
    var m = Math.floor(sec / 60);
    var s = sec - m * 60;
    var ss = s.toFixed(d);
    if (s < 10) ss = '0' + ss;
    return (m < 10 ? '0' + m : '' + m) + ':' + ss;
  };

  OM.fmtDelta = function (sec) {
    var s = Math.abs(sec);
    return (s < 10 ? s.toFixed(2) : s.toFixed(1)) + 's';
  };

  // UTC day index — the daily challenge rolls over at 00:00 UTC worldwide.
  OM.dayIndex = function (date) {
    var d = date || new Date();
    return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 86400000);
  };
  OM.dayKey = function (idx) {
    var ms = idx * 86400000;
    var d = new Date(ms);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
  };
  OM.msUntilNextDay = function () {
    var now = Date.now();
    return (Math.floor(now / 86400000) + 1) * 86400000 - now;
  };

  /* ---------- storage (never throws; private mode / blocked cookies are fine) ---------- */
  OM.store = {
    get: function (key, fallback) {
      try {
        var raw = root.localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { root.localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
    del: function (key) {
      try { root.localStorage.removeItem(key); return true; } catch (e) { return false; }
    }
  };

  /* ---------- tiny event bus ---------- */
  OM.bus = (function () {
    var map = {};
    return {
      on: function (name, fn) { (map[name] || (map[name] = [])).push(fn); return fn; },
      off: function (name, fn) {
        var l = map[name]; if (!l) return;
        var i = l.indexOf(fn); if (i >= 0) l.splice(i, 1);
      },
      emit: function (name, payload) {
        var l = map[name]; if (!l) return;
        for (var i = 0; i < l.length; i++) { try { l[i](payload); } catch (e) { /* a listener must never kill the loop */ } }
      }
    };
  })();
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ==== src/10-physics.js ==== */
/* ONE MORE — physics + difficulty director.
   Pure functions and constants only: no canvas, no DOM. This file is loaded by
   the browser AND by tools/validate.js + tools/test.js under node, so the
   fairness validator proves things about the exact code that ships. */
(function (root) {
  'use strict';
  var OM = root.OM || (root.OM = {});
  var clamp = OM.math.clamp;

  var P = OM.phys = {
    /* Logical space. The canvas letterboxes to this; H is fixed, W varies with
       the device aspect so phones and desktops see the same vertical challenge. */
    H: 720,
    CEIL: 96,          // inner surface of the ceiling
    FLOOR: 672,        // inner surface of the floor
    R: 16,             // collision radius (visual radius is slightly larger — forgiving)
    R_VIS: 18,

    BASE_SPEED: 430,   // px/s at t=0
    BASE_G: 3300,      // px/s^2 at BASE_SPEED

    PLAYER_X_FRAC: 0.27,
    VOID_DEATH: 260,   // px past a surface line before a fall through a hole kills

    NEAR_MISS_DIST: 15,   // px of clearance that counts as a near miss
    PERFECT_WINDOW: 0.34  // s after a flip during which a near miss reads as PERFECT
  };

  P.TUNNEL = P.FLOOR - P.CEIL;                 // 576
  /* Horizontal distance covered by one full surface-to-surface flip. Because
     g scales with speed^2 this is constant at every speed — the single most
     important decision in the whole game: every hand-authored pattern stays
     exactly as fair at 900px/s as it was at 430px/s. */
  P.TRANSIT_H = P.TUNNEL - 2 * P.R;            // 544
  P.TRANSIT_T = Math.sqrt(2 * P.TRANSIT_H / P.BASE_G);
  P.TRANSIT_X = P.TRANSIT_T * P.BASE_SPEED;    // ~247px

  /* Speed curve: fast early ramp so the first 20s already feels alive, then a
     slow linear creep that never stops. Reaches ~1000px/s around 5 minutes. */
  P.speedAt = function (t) {
    var ramp = 320 * (1 - Math.exp(-t / 42));
    return P.BASE_SPEED + ramp + Math.min(t, 400) * 0.62;
  };

  P.gravityFor = function (speed, mult) {
    var s = speed / P.BASE_SPEED;
    return P.BASE_G * s * s * (mult == null ? 1 : mult);
  };

  /* ---------- difficulty director ----------
     Returns the shape of the world at time t: which pattern tiers may spawn,
     how much breathing room between them, and how far ahead obstacles read. */
  var TIERS = [
    // [untilSeconds, weights per tier 1..5, spacing multiplier]
    [14, [1, 0, 0, 0, 0], 1.75],
    [34, [3, 1, 0, 0, 0], 1.35],
    [62, [3, 4, 1, 0, 0], 1.15],
    [96, [1, 4, 3, 1, 0], 1.02],
    [140, [0, 3, 4, 2, 1], 0.94],
    [200, [0, 1, 4, 4, 2], 0.88],
    [Infinity, [0, 0, 3, 4, 4], 0.82]
  ];

  P.directorAt = function (t) {
    for (var i = 0; i < TIERS.length; i++) {
      if (t < TIERS[i][0]) return { weights: TIERS[i][1], spacing: TIERS[i][2], band: i };
    }
    var last = TIERS[TIERS.length - 1];
    return { weights: last[1], spacing: last[2], band: TIERS.length - 1 };

/* ONE MORE — death replay.
   Every death captures the last two seconds: the player's path, and the actual
   obstacles around them. It replays on the results screen in slow motion,
   framed close on the moment it went wrong.
   It answers "what killed me" honestly — and it is the clip people post. */
(function (root) {
  'use strict';
  var OM = root.OM || (root.OM = {});
  var P = OM.phys, PAT = OM.patterns;

  var WINDOW = 2.1;      // seconds kept
  var RATE = 60;         // samples per second
  /* The window always shows the FULL tunnel height with margin above and below
     for the caption strip. An earlier version framed tight on the player, which
     looked dramatic and answered nothing: you could not see the surface you
     failed to reach. Context is the whole point.
     Horizontal extent is derived from the canvas rather than fixed, so the
     visible width and the width used for culling can never disagree — they did,
     and the right third of the panel rendered empty. */

  /* A ring buffer on the run; costs about 130 tiny objects. */
  OM.ReplayBuffer = function () {
    var f = [], acc = 0;
    return {
      frames: f,
      sample: function (dt, r) {
        acc += dt;
        if (acc < 1 / RATE) return;
        acc = 0;
        f.push({ t: r.t, x: r.px, y: r.y, grav: r.grav, rot: r.rot });
        while (f.length && f[0].t < r.t - WINDOW) f.shift();
      }
    };
  };

  /* Freeze what mattered: the path, plus a deep copy of the geometry near the
     death so the replay cannot be invalidated by the generator moving on. */
  OM.captureDeath = function (r, cause) {
    var lo = r.px - 1500, hi = r.px + 700;
    function near(list) {
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var o = list[i];
        if (o.x + (o.w || 0) < lo || o.x > hi) continue;
        var c = {};
        for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k) && k.charAt(0) !== '_') c[k] = o[k];
        out.push(c);

      return out;

    return {
      frames: r.replay.frames.slice(),
      obstacles: near(r.gen.obstacles),
      holes: near(r.gen.holes),
      deathT: r.t, deathX: r.px, deathY: r.y, grav: r.grav, rot: r.rot,
      cause: cause, world: r.world.id, evo: OM.progress.activeCore()

    spike: 'SPIKES', block: 'A BLOCK', bar: 'A BAR', mover: 'A MOVER',

    var data = null, raf = 0, t0 = 0, running = false;

      var strip = fs * 2.6;
      g.fillStyle = 'rgba(8,9,12,0.78)';
      g.fillRect(0, canvas.height - strip, canvas.width, strip);
      g.fillStyle = 'rgba(232,234,240,0.6)';
      g.font = '600 ' + fs + 'px ui-monospace, Menlo, monospace';
      g.textAlign = 'left';

    for (var k in screens) screens[k].classList.remove('on');
    UI.screen = null;
    $('pause-btn').classList.add('on');
  };

  UI.startRun = function (mode, opts) {
    UI.lastMode = mode;
    if (replay) replay.stop();
    UI.hideAll();
    OM.game.start(mode, opts || (mode === 'trial' ? { family: UI.lastFamily } : {}));
  };

  /* ---------- challenge links ----------
     A seed is the whole world, so a seed is the whole challenge. It rides in
     the hash where it costs no server and no round trip: open the link and the
     menu offers the exact run somebody else just played.

     Anything unparseable is ignored rather than coerced. A hash that produced
     *some* world for a link meant to produce a specific one would be the worst
     outcome available here — two people would believe they were playing the
     same thing and quietly not be. */
  function parseChallenge(hash) {
    var m = /(?:^|[#&])c=([0-9a-z]{1,7})(?:&|$)/i.exec(hash || '');
    if (!m) return null;
    var n = parseInt(m[1], 36);
    if (!isFinite(n) || n < 0 || n > 0xffffffff) return null;
    return n >>> 0;
  }

  function readChallenge() {
    UI.challenge = parseChallenge(root.location && root.location.hash);
    var cb = $('menu-challenge');
    if (UI.challenge == null) { cb.hidden = true; return; }
    cb.hidden = false;
    cb.querySelector('em').textContent = 'world ' + UI.code(UI.challenge) +
      ' \u00b7 sent to you';
  }

  UI.code = function (seed) { return (seed >>> 0).toString(36).toUpperCase(); };

  /* Only a real link is worth sharing. Under file:// the href is a path on
     somebody else's disk, so there is nothing to offer and we say nothing. */
  UI.challengeLink = function (seed) {
    var loc = root.location;
    if (!loc || !/^https?:$/.test(loc.protocol)) return null;
    return loc.href.split('#')[0] + '#c=' + UI.code(seed).toLowerCase();
  };

  /* The same world again: same obstacles, same mutations, same everything the
     seed derives. Nothing about the layout is stored — only the number it came
     from — so this cannot drift out of step with what the generator would build.
     Daily has no button because Daily is already this: ONE MORE replays it. */
  UI.retryRun = function () {
    var s = OM.game.run && OM.game.run.summary;
    if (!s || s.seed == null || s.mode === 'daily') return;
    UI.startRun(s.mode, { seed: s.seed, day: s.day, family: s.family,
                          pool: s.pool, ghost: s.ghost });
  };

  /* A Trial points the generator at whatever is actually killing you. It is not
     a different game — same physics, same proven patterns, different selection. */
  UI.startTrial = function () {
    var rd = OM.analysis.read();
    if (rd.kind !== 'weakness') { UI.toast('NOT ENOUGH RUNS YET'); return; }
    UI.lastFamily = rd.family;
    UI.startRun('trial', { family: rd.family });
  };

  UI.pause = function () {
    if (OM.game.state !== 'playing') return;
    OM.game.state = 'paused';
    OM.audio.stopMusic();
    UI.show('pause');
    $('pause-btn').classList.remove('on');
  };
  UI.resume = function () {
    if (OM.game.state !== 'paused') return;
    OM.game.state = 'playing';
    UI.hideAll();
  };

  /* ---------- menu ---------- */
  function refreshMenu() {
    var d = prog.data, li = prog.levelInfo();
    $('menu-best').textContent = d.best > 0 ? 'BEST ' + OM.fmtTime(d.best, 2) : 'NO RUNS YET';
    $('menu-level').textContent = 'LEVEL ' + li.level;
    var tagEl = doc.querySelector('#s-menu .tag');
    if (tagEl) {
      tagEl.textContent = OM.game.portrait
        ? 'Tap to flip gravity. Turn your phone sideways for a wider view.'
        : 'Tap to flip gravity. Survive one more time.';
    }
    var key = OM.dayKey(OM.dayIndex());
    var done = d.daily[key];
    $('daily-badge').textContent = done ? 'today: ' + OM.fmtTime(done, 2) : 'not played today';

    var nb = $('menu-nightmare');
    if (prog.nightmareUnlocked()) {
      nb.hidden = false;
      nb.querySelector('em').textContent = d.nightmare
        ? 'best ' + OM.fmtTime(d.nightmare, 2) : 'no warnings, no warm-up';
    } else nb.hidden = true;

    var cb = $('menu-challenge');
    cb.hidden = UI.challenge == null;

    var rd = OM.analysis.read(), tb = $('menu-trial');
    if (rd.kind === 'weakness') {
      tb.hidden = false;
      var best = d.trial[rd.family];
      tb.querySelector('em').textContent = rd.headline.toLowerCase() +
        (best ? ' · best ' + OM.fmtTime(best, 2) : ' · not attempted');
    } else tb.hidden = true;
  }

  /* ---------- daily ---------- */
  UI.showDaily = function () {
    var idx = OM.dayIndex(), key = OM.dayKey(idx);
    $('d-day').textContent = 'DAY ' + (idx - 20000);
    $('d-date').textContent = key + ' · UTC';
    $('d-best').textContent = prog.data.daily[key] ? OM.fmtTime(prog.data.daily[key], 2) : '—';
    $('d-streak').textContent = prog.dailyStreak() + 'd';
    var ms = OM.msUntilNextDay();
    var h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
    $('d-reset').textContent = 'New challenge in ' + h + 'h ' + m + 'm.';
    UI.show('daily');
  };

  /* ---------- results ---------- */
  UI.showResult = function (s) {
    var d = prog.data;
    var best = s.mode === 'endless' ? d.best : (d.daily[OM.dayKey(s.day)] || 0);
    var res = s.result;

    $('r-kicker').textContent = res.record
      ? (s.mode === 'trial' ? 'BEST TRIAL' : 'NEW RECORD')
      : (s.mode === 'trial' ? 'TRIAL · ' + (OM.analysis.families[s.family || UI.lastFamily] || { name: '' }).name
                            : 'YOU SURVIVED');
    $('r-time').textContent = OM.fmtTime(s.time, 2);

    var dEl = $('r-delta');
    dEl.classList.toggle('record', !!res.record);
    if (res.record) {
      dEl.textContent = s.mode === 'daily' ? 'BEST TODAY' : 'PERSONAL BEST';
    } else if (best > 0) {
      // The number that creates "one more": how close you were, not how far.
      dEl.textContent = OM.fmtDelta(best - s.time) + ' FROM YOUR BEST · ' + OM.fmtTime(best, 2);
    } else dEl.textContent = '';

    $('r-stats').innerHTML =
      stat(s.nearMiss, 'NEAR MISS') + stat(s.perfect, 'PERFECT') +
      stat(s.flips, 'FLIPS') + stat(s.world.name, 'REACHED');

    doc.querySelector('#r-actions [data-act="retry"]').hidden =
      s.mode === 'daily' || s.seed == null;

    // last moments
    var box = doc.querySelector('.replay');
    if (!replay) replay = OM.ReplayPlayer($('r-replay'));
    if (s.replay && s.replay.frames && s.replay.frames.length > 6) {
      box.classList.remove('off');
      replay.load(s.replay);
      // the element has to be laid out before the canvas can size itself
      requestAnimationFrame(function () { replay.start(); });
    } else {
      box.classList.add('off');
      replay.stop();
    }

    renderRead(s);

    var li = prog.levelInfo();
    $('r-xpfill').style.transform = 'scaleX(' + li.frac.toFixed(4) + ')';
    $('r-xplabel').textContent = 'LEVEL ' + li.level + (li.capped ? ' · MAX' : '') +
      '  +' + res.xp + ' XP';

    var un = [];
    if (res.levelUp) un.push('LEVEL ' + res.level + ' REACHED');
    for (var i = 0; i < res.achievements.length; i++) un.push('UNLOCKED · ' + res.achievements[i].name);
    var newCore = prog.cores.filter(function (c) { return c.at === res.level; })[0];
    if (res.levelUp && newCore) un.push('EVOLUTION · ' + newCore.name);
    $('r-unlocks').innerHTML = un.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (res.levelUp) OM.audio.play('level');

    UI.show('result');
  };

  function stat(v, k) {
    return '<div><span class="n">' + v + '</span><span class="k">' + k + '</span></div>';
  }

  /* The habit, in the same voice as the rest of the read: the claim, the number
     underneath it, and what to do. The multiple is carried rather than hidden
     because it is the whole reason the claim is worth anything — 61% of deaths
     means nothing until you know it is twice what your own flip rate explains. */
  function habitLine(h) {
    return h.headline + ' · ' + Math.round(h.share * 100) + '% of deaths, ' +
           h.mult.toFixed(1) + '× normal for how often you flip. ' + h.fix;
  }

  /* One honest sentence, or nothing. Never a fabricated percentile, never a
     comparison to players we cannot see. */
  /* Whether the drilling worked, in a sentence, with both raw counts in it so
     the percentages can be checked. It says "since", never "because": the game
     knows what changed, not what caused it, and the difference is the whole
     reason this line is trustworthy. */
  function trialEffectLine(te) {
    var b = Math.round(te.before.share * 100), a = Math.round(te.after.share * 100);
    var counts = ' (' + te.before.count + ' of ' + te.before.n + ' \u2192 ' +
                 te.after.count + ' of ' + te.after.n + ')';
    var head = 'Since your first ' + te.name + ' trial, deaths to ' + te.noun + ' ';
    if (te.direction === 'flat') {
      return head + 'are unchanged: ' + b + '% then, ' + a + '% now' + counts + '.';
    }
    return head + (te.direction === 'down' ? 'have fallen from ' : 'have risen from ') +
           b + '% to ' + a + '%' + counts + '.';
  }

  function renderRead(s) {
    var el = $('r-read'), rd = OM.analysis.read(), hb = OM.analysis.habit(), tr = OM.analysis.trend();
    var html = '';
    if (rd.kind === 'none') {
      html = '<b>READING YOU</b><span>' + rd.need +
             ' more run' + (rd.need === 1 ? '' : 's') +
             ' and the game will tell you what keeps killing you.</span>';
    } else if (rd.kind === 'balanced') {
      html = '<b>' + rd.headline + '</b><span>' + rd.line + '</span>';
    } else {
      html = '<b>' + rd.headline + '</b><span>' + rd.line + ' ' +
             Math.round(rd.share * 100) + '% of your last ' + rd.n + ' deaths.</span>';
    }
    /* A habit is the more specific of the two claims and carries its own advice,
       so it stands in for the family's generic fix rather than stacking a second
       instruction under it. It is also the only thing the balanced read has ever
       had to offer, which is why that case is no longer always quiet. */
    if (hb) html += '<i>' + habitLine(hb) + '</i>';
    else if (rd.kind === 'weakness') html += '<i>' + rd.fix + '</i>';
    el.className = (rd.kind === 'weakness' || hb) ? 'read' : 'read quiet';
    if (tr && Math.abs(tr.pct) > 0.12) {
      html += '<i>' + (tr.delta > 0 ? 'Improving: ' : 'Slipping: ') +
              'median run ' + OM.fmtTime(tr.early, 2) + ' \u2192 ' + OM.fmtTime(tr.recent, 2) + '</i>';
    }
    /* The payoff the read has always set up and never delivered. After a Trial
       it goes at the top, because on that screen it is the answer to the
       question the run was asking. */
    var te = OM.analysis.trialEffect(s.mode === 'trial' ? (s.family || UI.lastFamily)
                                                        : (rd.family || null));
    if (te) {
      var block = '<i class="verdict">' + trialEffectLine(te) + '</i>';
      if (s.mode === 'trial') { html = block + html; el.className = 'read'; }
      else html += block;
    }

    el.innerHTML = html;
    var tb = doc.querySelector('#r-actions [data-act="trial"]');
    tb.hidden = rd.kind !== 'weakness';
    if (rd.kind === 'weakness') UI.lastFamily = rd.family;
  }

  /* ---------- records ---------- */
  UI.showRecords = function () {
    var d = prog.data, li = prog.levelInfo();
    var causes = Object.keys(d.deaths).sort(function (a, b) { return d.deaths[b] - d.deaths[a]; });
    var CAUSE = { spike: 'Spikes', block: 'Blocks', bar: 'Bars', mover: 'Movers', laser: 'Lasers', void: 'The void' };

    var days = [], today = OM.dayIndex();
    for (var i = 0; i < 7; i++) {
      var k = OM.dayKey(today - i);
      days.push(row(k + (i === 0 ? ' · today' : ''), d.daily[k] ? OM.fmtTime(d.daily[k], 2) : '—'));
    }

    var rd = OM.analysis.read(), hb = OM.analysis.habit(), tr = OM.analysis.trend(), tl = OM.analysis.tally();
    var readBlock = '';
    if (rd.kind === 'weakness') {
      readBlock = '<b>' + rd.headline + '</b><span>' + rd.line + ' ' +
        rd.count + ' of your last ' + rd.n + ' deaths (' + Math.round(rd.share * 100) + '%).</span>' +
        '<i>' + rd.fix + '</i>';
    } else if (rd.kind === 'balanced') {
      readBlock = '<b>' + rd.headline + '</b><span>' + rd.line + '</span>';
    } else {
      readBlock = '<b>READING YOU</b><span>' + rd.need +
        ' more runs before the game can say anything useful about how you play.</span>';
    }
    /* This is the screen you come to in order to study, so the habit sits
       alongside the family advice here rather than replacing it as it does on
       the results screen, and it spells out the baseline it was judged against
       instead of compressing that into a multiple. */
    if (hb) {
      readBlock += '<i>' + hb.headline + ' · ' + hb.count + ' of ' + hb.n + ' deaths (' +
        Math.round(hb.share * 100) + '%), against ' + Math.round(hb.expected * 100) +
        '% expected at your flip rate. ' + hb.fix + '</i>';
    }
    /* On the study screen every family that has a measurement is shown, not just
       the strongest one. This is the page you come to in order to look things
       up, and a drill that made something worse belongs here as much as one
       that worked. */
    var tes = OM.analysis.trialEffects();
    for (var ti = 0; ti < tes.length; ti++) {
      readBlock += '<i class="verdict">' + trialEffectLine(tes[ti]) + '</i>';
    }

    readBlock = '<div class="read' +
      ((rd.kind === 'weakness' || hb) ? '' : ' quiet') + '">' + readBlock + '</div>';
    if (tr) {
      readBlock += '<div class="list">' +
        row('Median run, first 15', OM.fmtTime(tr.early, 2)) +
        row('Median run, last 15', OM.fmtTime(tr.recent, 2)) +
        row('Change', (tr.delta >= 0 ? '+' : '') + OM.fmtDelta(tr.delta)) +
      '</div>';
    }
    var famRows = Object.keys(tl.byFamily).sort(function (a, b) { return tl.byFamily[b] - tl.byFamily[a]; })
      .map(function (f) {
        return row(OM.analysis.families[f].name.charAt(0) + OM.analysis.families[f].name.slice(1).toLowerCase(),
                   tl.byFamily[f] + ' · ' + Math.round(tl.byFamily[f] / tl.n * 100) + '%');
      }).join('');

    $('rec-body').innerHTML =
      '<h3>THE READ</h3>' + readBlock +
      sparkline(OM.analysis.history()) +
      (famRows ? '<h3>DEATHS BY KIND</h3><div class="list">' + famRows + '</div>' : '') +
      '<div class="split"><div><span class="lbl">BEST RUN</span><span class="val">' +
        (d.best ? OM.fmtTime(d.best, 2) : '—') + '</span></div>' +
      '<div><span class="lbl">LEVEL</span><span class="val">' + li.level + '</span></div>' +
      '<div><span class="lbl">RUNS</span><span class="val">' + d.runs + '</span></div></div>' +
      (d.nightmare ? '<div class="list">' + row('Nightmare best', OM.fmtTime(d.nightmare, 2)) +
        Object.keys(d.trial).map(function (f) {
          return row('Trial · ' + OM.analysis.families[f].name, OM.fmtTime(d.trial[f], 2));
        }).join('') + '</div>' : '') +

      '<h3>TOTALS</h3><div class="list">' +
        row('Time survived', fmtLong(d.totalTime)) +
        row('Near misses', d.nearMiss) +
        row('Perfect switches', d.perfect) +
        row('Gravity flips', d.flips) +
        row('Daily challenges', d.dailyDone.length + ' · streak ' + prog.dailyStreak() + 'd') +
      '</div>' +

      '<h3>WHAT KILLS YOU</h3><div class="list">' +
        (causes.length ? causes.map(function (c) {
          return row(CAUSE[c] || c, d.deaths[c] + ' × ' + Math.round(d.deaths[c] / d.runs * 100) + '%');
        }).join('') : row('Nothing yet', '—')) +
      '</div>' +

      '<h3>DAILY · LAST 7</h3><div class="list">' + days.join('') + '</div>' +

      '<h3>ACHIEVEMENTS</h3><div class="list">' +
        prog.achievements.map(function (a) {
          var got = d.achievements.indexOf(a.id) >= 0;
          return '<div class="item' + (got ? '' : ' locked') + '"><b>' + a.name +
                 '<i>' + a.line + '</i></b><span>' + (got ? '✓' : '') + '</span></div>';
        }).join('') +
      '</div>' +
      '<p class="muted small">Everything here is measured from your own runs and stored on this device. ' +
      'There is no server yet, so nothing here is a global leaderboard and nothing is compared to other players.</p>';
    UI.show('records');
  };

  function row(k, v) { return '<div class="item"><b>' + k + '</b><span>' + v + '</span></div>'; }

  /* Your last thirty runs as bars, with your best marked. Inline SVG so it
     needs no canvas lifecycle and scales with the layout. It is the clearest
     possible answer to "am I actually getting better". */
  function sparkline(hist) {
    var runs = hist.slice(-30);
    if (runs.length < 6) return '';
    var max = 0, i;
    for (i = 0; i < runs.length; i++) max = Math.max(max, runs[i].t);
    if (max <= 0) return '';
    var W = 100, H = 30, bw = W / runs.length, bars = '', bestI = 0;
    for (i = 0; i < runs.length; i++) if (runs[i].t > runs[bestI].t) bestI = i;
    for (i = 0; i < runs.length; i++) {
      var h = Math.max(0.8, (runs[i].t / max) * (H - 2));
      bars += '<rect x="' + (i * bw + bw * 0.16).toFixed(2) + '" y="' + (H - h).toFixed(2) +
              '" width="' + (bw * 0.68).toFixed(2) + '" height="' + h.toFixed(2) +
              '" fill="' + (i === bestI ? '#e8eaf0' : 'rgba(232,234,240,0.34)') + '"/>';
    }
    return '<h3>LAST ' + runs.length + ' RUNS</h3>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
      'style="width:100%;height:64px;display:block;margin:10px 0 4px" role="img" ' +
      'aria-label="Bar chart of your last ' + runs.length + ' run times, longest run highlighted">' +
      bars + '</svg>' +
      '<p class="muted small" style="text-align:left;margin:0 0 6px">' +
      'oldest on the left · longest run highlighted · peak ' + OM.fmtTime(max, 2) + '</p>';
  }
  function fmtLong(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60;
    return (h ? h + 'h ' : '') + m + 'm ' + Math.floor(sec % 60) + 's';
  }

  /* ---------- garage ---------- */
  UI.showGarage = function () {
    var lv = prog.levelInfo().level, c = prog.data.cosmetics;
    function group(title, list, kind, current, extra) {
      return '<h3>' + title + '</h3><div class="chips">' + (extra || '') + list.map(function (it) {
        var open = lv >= it.at;
        return '<button class="chip' + (current === it.id ? ' on' : '') + '"' +
               (open ? '' : ' disabled') + ' data-kind="' + kind + '" data-id="' + it.id + '">' +
               it.name + '<small>' + (open ? (it.line || 'unlocked') : 'LEVEL ' + it.at) + '</small></button>';
      }).join('') + '</div>';
    }
    var autoChip = '<button class="chip' + (c.core === 'auto' ? ' on' : '') +
      '" data-kind="core" data-id="auto">AUTO<small>follows your level</small></button>';
    $('gar-body').innerHTML =
      group('CORE', prog.cores, 'core', c.core, autoChip) +
      group('TRAIL', prog.trails, 'trail', c.trail) +
      group('DEATH', prog.deaths, 'death', c.death) +
      (function () {
        var next = prog.cores.filter(function (x) { return x.at > lv; })[0];
        return '<p class="muted small">Level ' + lv + '. ' +
          (next ? 'Next evolution at level ' + next.at + '.'
                : 'Every evolution unlocked.') + '</p>';
      })();

    var chips = $('gar-body').querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function (e) {
        var kind = this.getAttribute('data-kind');
        prog.data.cosmetics[kind] = this.getAttribute('data-id');
        prog.touch(); prog.flush();
        OM.audio.play('ui');
        UI.showGarage();
      });
    }
    UI.show('garage');
  };

  /* ---------- settings ---------- */
  UI.showSettings = function () {
    var s = prog.data.settings;
    var items = [
      ['sound', 'Sound effects'], ['music', 'Music'],
      ['shake', 'Screen shake'], ['haptics', 'Haptics'], ['reduced', 'Reduced motion']
    ];
    $('set-body').innerHTML = items.map(function (it) {
      return '<div class="toggle"><span>' + it[1] + '</span>' +
             '<button data-set="' + it[0] + '" aria-pressed="' + !!s[it[0]] + '"></button></div>';
    }).join('') +
    '<p class="muted small" style="margin-top:22px">ONE MORE stores your records in this browser. Nothing is uploaded.</p>' +
    '<button class="btn small" id="wipe" style="margin-top:8px">ERASE ALL DATA</button>';

    var btns = $('set-body').querySelectorAll('[data-set]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var k = this.getAttribute('data-set');
        s[k] = !s[k];
        this.setAttribute('aria-pressed', String(s[k]));
        prog.touch(); prog.flush();
        OM.audio.setMuted(!s.sound);
        OM.audio.setMusic(s.music && s.sound);
        OM.audio.play('ui');
      });
    }
    var wipe = $('wipe'), armed = false;
    wipe.addEventListener('click', function () {
      if (!armed) { armed = true; wipe.textContent = 'TAP AGAIN TO CONFIRM'; return; }
      prog.reset();
      UI.toast('DATA ERASED');
      UI.show('menu');
    });
    UI.show('settings');
  };

  /* ---------- share ----------
     No download link: the artifact sandbox blocks page-initiated downloads and
     a dead button is worse than no button. Native share if the device has it,
     clipboard otherwise.

     What gets shared is the read, not the time. A time is unarguable and so it
     travels nowhere; a claim about how someone plays is the part a reader can
     answer. Below the evidence gate shareClaim() returns null and we fall back
     to the time — manufacturing a read at run three to make a better share
     string is exactly the trade this game does not make. */
  UI.share = function () {
    var s = OM.game.run && OM.game.run.summary;
    if (!s) return;
    var head = 'ONE MORE · ' + OM.fmtTime(s.time, 2) +
      (s.mode === 'daily' ? ' on Daily ' + OM.dayKey(s.day) : '');
    var claim = OM.analysis.shareClaim();
    var text = claim
      ? head + ' — and it says ' + claim + '. What does it say about you?'
      : head + ' · ' + s.perfect + ' perfect switches · reached ' +
        s.world.name + '. Can you beat it?';

    /* The world comes along with the claim, so "can you beat it" is answerable
       on the run that actually beat me rather than on a different one.
       Endless only: the same seed under a Trial or Nightmare builds a different
       world, and Daily already gives everyone today's, so a link there would
       hand them something other than what it appears to. */
    var link = s.mode === 'endless' ? UI.challengeLink(s.seed) : null;
    if (link) text += '\n' + link;
    if (root.navigator && root.navigator.share) {
      root.navigator.share({ title: 'ONE MORE', text: text }).catch(function () {});
      return;
    }
    if (root.navigator && root.navigator.clipboard) {
      root.navigator.clipboard.writeText(text).then(
        function () { UI.toast('RESULT COPIED'); },
        function () { UI.toast('COULD NOT COPY'); }
      );
    } else UI.toast('SHARING UNAVAILABLE');
  };

  var toastT = 0;
  UI.toast = function (msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove('on'); }, 1700);
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ==== src/99-boot.js ==== */
/* ONE MORE — boot: canvas, input, the frame loop. */
(function (root) {
  'use strict';
  var OM = root.OM;
  var doc = root.document;

  function start() {
    var canvas = doc.getElementById('stage');
    OM.game.attach(canvas);
    OM.ui.init();

    var s = OM.progress.data.settings;
    OM.audio.setMuted(!s.sound);
    OM.audio.setMusic(s.music && s.sound);

    /* ---------- input ----------
       pointerdown, not click: it fires on touch-down rather than touch-up,
       which is the difference between a game that feels instant and one that
       feels like a web page. */
    function press(e) {
      if (OM.ui.screen !== null) return;      // a menu is open; let it have the tap
      e.preventDefault();
      OM.audio.unlock();
      OM.game.flip();
    }
    canvas.addEventListener('pointerdown', press);

    /* The results screen scrolls on a phone, so "tap anywhere to go again" has
       to be a real tap: press and release in the same place, quickly. Firing on
       pointerdown would restart the run every time somebody tried to scroll
       down to read the death analysis. */
    var resultEl = doc.getElementById('s-result');
    var tap = null;
    resultEl.addEventListener('pointerdown', function (e) {
      if (e.target && e.target.closest && e.target.closest('[data-act], canvas')) { tap = null; return; }
      tap = { x: e.clientX, y: e.clientY, t: performance.now() };
    });
    resultEl.addEventListener('pointerup', function (e) {
      if (!tap) return;
      var moved = Math.abs(e.clientX - tap.x) + Math.abs(e.clientY - tap.y);
      var held = performance.now() - tap.t;
      tap = null;
      if (moved > 12 || held > 500) return;                 // that was a scroll or a hold
      if (OM.ui.screen !== 'result') return;
      if (!OM.game.run || OM.game.run.deadFor <= 0.22) return;
      e.preventDefault();
      OM.ui.startRun(OM.ui.lastMode);
    });
    resultEl.addEventListener('pointercancel', function () { tap = null; });

    doc.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      var k = e.key;
      if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'w' || k === 'W') {
        e.preventDefault();
        OM.audio.unlock();
        if (OM.ui.screen === 'result') {
          if (OM.game.run && OM.game.run.deadFor > 0.22) OM.ui.startRun(OM.ui.lastMode);
        } else if (OM.ui.screen === 'menu') OM.ui.startRun('endless');
        else if (OM.ui.screen === null) OM.game.flip();
      } else if (k === 'Escape' || k === 'p' || k === 'P') {
        if (OM.game.state === 'playing') OM.ui.pause();
        else if (OM.game.state === 'paused') OM.ui.resume();
      }
    });

    // Losing focus mid-run must pause, never kill: a notification should not
    // cost somebody their record.
    doc.addEventListener('visibilitychange', function () {
      if (doc.hidden && OM.game.state === 'playing') OM.ui.pause();
    });
    root.addEventListener('blur', function () {
      if (OM.game.state === 'playing') OM.ui.pause();
    });

    /* ---------- loop ---------- */
    var last = performance.now();
    function frame(now) {
      var dt = (now - last) / 1000;
      last = now;
      // A long stall (tab switch, GC) must not teleport the player through a
      // wall — clamp instead of integrating a two second step.
      if (dt > 0.05) dt = 0.05;

      if (OM.game.state === 'playing' || OM.game.state === 'dead') {
        OM.game.tick(dt);
      } else if (OM.game.state === 'paused') {
        OM.game.draw();
      } else {
        OM.game.drawMenuNanogon(now / 1000);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', start);
  else start();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
